# cargo-deny's policy for the dependency tree. scripts/check.sh runs
# `cargo deny check bans licenses sources`; CI and the nightly run add
# `cargo deny check advisories` with the defaults.
#
# Changing this file needs the maintainer's explicit approval (AGENTS.md).

[licenses]
# Licenses whose code may be combined into an AGPL-3.0-or-later binary.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "AGPL-3.0-or-later",
]
# The list is the policy for crates still to come, so an entry no crate uses
# yet is expected.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
deny = [
  { crate = "openssl", reason = "TLS goes through rustls, so the binary stays static" },
  { crate = "openssl-sys", reason = "TLS goes through rustls, so the binary stays static" },
]

[sources]
# crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
