[package]
name = "phyllon"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nemesis398/phyllon"
publish = false

# The lint baseline from section 3.5 of docs/research/engineering-quality.md.
# scripts/check.sh runs clippy with warnings denied, so "warn" fails the gate
# as surely as "deny". A plain `cargo build` runs only the rustc lints, so it
# enforces `unsafe_code` but none of the Clippy lints.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"
string_slice = "warn"
print_stdout = "warn"
let_underscore_must_use = "warn"
allow_attributes_without_reason = "deny"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "string"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["time", "rt-multi-thread", "net", "signal", "macros"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
tower-http = { version = "0.7.1", default-features = false, features = ["set-header", "catch-panic"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
