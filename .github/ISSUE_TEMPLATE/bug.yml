name: Bug report
description: Something does not work as documented.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here. Use the private reporting page
        linked on the issue chooser.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or image tag, or the commit if you built it.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install-path
    attributes:
      label: Install path
      description: How you run Phyllon.
      options:
        - Docker
        - Podman
        - Quadlet
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order, from a fresh start.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead. Paste logs as text, not as images.
    validations:
      required: true
