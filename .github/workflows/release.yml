# Releases a version once its release pull request, which
# scripts/prepare-release.sh prepares, is squash-merged to main. On every
# other push to main, release-plz finds nothing to release and the later jobs
# are skipped (release_always = false in release-plz.toml).
#
# release-plz tags the commit and creates a draft release. build.yml, a
# reusable workflow, builds, attests and signs. attach puts the files on the
# draft; verify checks every file and the image against build.yml as the
# signer; publish moves the image's minor-line tag and publishes the draft as a
# pre-release. The draft exists because an immutable release takes no new
# assets once published, and a failed, skipped or canceled verify leaves the
# release a draft (docs/decisions/0006-release-pipeline.md).
#
# Every job with steps starts with Harden-Runner in block mode, with the hosts
# its audit run reached. GitHub's own domains pass whatever the list says
# (0006).
#
# Changing this file needs the maintainer's explicit approval (AGENTS.md).

name: Release

on:
  push:
    branches: [main]

permissions: {}

# One release at a time, and a running release is never canceled halfway.
concurrency:
  group: release
  cancel-in-progress: false

# With shell: bash, a run: step also fails when a command inside a pipe fails.
defaults:
  run:
    shell: bash

# The identity every release file must carry. Written out, not taken from the
# run, so verify checks against fixed values.
env:
  BIN: phyllon
  IMAGE: ghcr.io/nemesis398/phyllon
  SIGNER: nemesis398/phyllon/.github/workflows/build.yml
  CALLER: nemesis398/phyllon/.github/workflows/release.yml

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The tag and the draft release, both through the API.
      contents: write
      # release_always = false looks up the pull request behind the commit.
      pull-requests: read
    outputs:
      released: ${{ steps.out.outputs.released }}
      tag: ${{ steps.out.outputs.tag }}
      version: ${{ steps.out.outputs.version }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            index.crates.io:443
            static.crates.io:443
            static.rust-lang.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - id: release-plz
        uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        with:
          command: release
          version: 0.4.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The tag reaches later run: steps only through the environment, and
      # only in the form v1.2.3.
      - id: out
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=$(jq -r '.[0].tag // empty' <<<"${RELEASES:-[]}")
          version=$(jq -r '.[0].version // empty' <<<"${RELEASES:-[]}")
          if [ -z "$tag" ]; then
            echo "released=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$tag" == "v$version" ]]; then
            echo "unexpected tag '$tag' for version '$version'" >&2
            exit 1
          fi
          {
            echo "released=true"
            echo "tag=$tag"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

  build:
    name: build
    needs: release-plz
    if: needs.release-plz.outputs.released == 'true'
    # A called workflow gets no more than its calling job holds, so this is
    # the union of build.yml's jobs.
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    # actionlint 1.7.12 rejects the "$/" self-repository form that zizmor
    # 1.31.1 asks for, so the call keeps the "./" form (0006).
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.release-plz.outputs.tag }}
      version: ${{ needs.release-plz.outputs.version }}

  attach:
    name: attach
    needs: [release-plz, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            uploads.github.com:443
            results-receiver.actions.githubusercontent.com:443
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compose
          path: assets
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-plz.outputs.tag }}
        run: |
          ls -l assets
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY"

  verify:
    name: verify
    needs: [release-plz, build, attach]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # A draft is visible only to a token that can write.
      contents: write
      attestations: read
      # The image and its signature on GHCR, while the package is private.
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-plz.outputs.tag }}
      VERSION: ${{ needs.release-plz.outputs.version }}
      DIGEST: ${{ needs.build.outputs.image-digest }}
      BINARIES: ${{ needs.build.outputs.binaries }}
    steps:
      # As in build.yml's manifest job for cosign; gh attestation verify reads
      # the bundles from tmaproduction and its trusted roots through TUF.
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Check the draft and its files
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$TAG" == "v$VERSION" ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,tagName --jq '"\(.isDraft) \(.tagName)"')" = "true $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          ls -l assets
          # Exactly the files build.yml made: each binary, its SBOM and
          # compose.yaml.
          expected=(compose.yaml)
          for name in $BINARIES; do
            [[ "$name" =~ ^[a-z0-9_-]+-unknown-linux-musl$ && "$name" == "$BIN-"* ]]
            expected+=("$name" "$name.cdx.json")
          done
          test "${#expected[@]}" -eq 5
          diff <(printf '%s\n' "${expected[@]}" | sort) <(find assets -type f -printf '%f\n' | sort)
          # compose.yaml pins the image that is verified below.
          test "$(grep -cxF "    image: $IMAGE:$VERSION@$DIGEST" assets/compose.yaml)" -eq 1
      - name: Verify the files against build.yml
        run: |
          for file in assets/*; do
            echo "::group::$file"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER" --source-ref refs/heads/main \
              --deny-self-hosted-runners --format json |
              jq '.[] | .verificationResult.signature.certificate | {buildSignerURI, buildConfigURI, sourceRepositoryRef, runInvocationURI}'
            # The caller must not pass as the signer.
            if gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$CALLER" >/dev/null 2>&1; then
              echo "release.yml passed as the signer of $file" >&2
              exit 1
            fi
            echo "::endgroup::"
          done
      - name: Verify the image against build.yml
        run: |
          # The version tag names the digest build.yml reported.
          test "$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
            --format '{{json .Manifest}}' | jq -r .digest)" = "$DIGEST"
          gh attestation verify "oci://$IMAGE:$VERSION" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER" --source-ref refs/heads/main \
            --deny-self-hosted-runners --format json |
            jq '.[] | .verificationResult.signature.certificate | {buildSignerURI, buildConfigURI, sourceRepositoryRef, runInvocationURI}'
          if gh attestation verify "oci://$IMAGE:$VERSION" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$CALLER" >/dev/null 2>&1; then
            echo "release.yml passed as the signer of the image" >&2
            exit 1
          fi
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/$SIGNER@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  publish:
    name: publish
    needs: [release-plz, build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      # The minor-line tag on GHCR.
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-plz.outputs.tag }}
      VERSION: ${{ needs.release-plz.outputs.version }}
      DIGEST: ${{ needs.build.outputs.image-digest }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The minor line, such as 0.1, moves only to a verified image, because
      # podman auto-update and compose pull follow it. A single source keeps
      # its digest, which the check confirms.
      - name: Move the minor-line tag
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          minor="${VERSION%.*}"
          docker buildx imagetools create --tag "$IMAGE:$minor" "$IMAGE@$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:$minor" \
            --format '{{json .Manifest}}' | jq -r .digest)" = "$DIGEST"
      - run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '{draft, prerelease, immutable, assets: [.assets[].name]}'
