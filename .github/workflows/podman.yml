# Boots a Fedora Cloud VM under KVM and checks that it runs SELinux enforcing
# and rootless Podman, because GitHub's Ubuntu runners have no SELinux. This is
# the first step of Task 13: the stack and the Quadlet units follow once the
# timings show whether pull requests can afford the VM. It is not a required
# check.
#
# Changing this file needs the maintainer's explicit approval (AGENTS.md).

name: Podman

on:
  pull_request:
    paths:
      - "compose*.yaml"
      - "deploy/**"
      - "Dockerfile"
      - "scripts/ci/fedora-vm.sh"
      - ".github/workflows/podman.yml"

permissions: {}

concurrency:
  group: podman-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  podman:
    name: podman
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner has /dev/kvm, but only root may open it. The rule is the one
      # GitHub documents for its Linux runners:
      # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
      - name: Open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      # From Ubuntu's archive: QEMU, qemu-img and cloud-localds. gpgv, curl,
      # ssh and setpriv are on the runner already.
      - name: Install QEMU and cloud-localds
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils
          qemu-system-x86_64 --version
      # fedora-vm.sh downloads and verifies the image, so the time includes
      # the download.
      - name: SELinux and Podman in the Fedora VM
        run: |
          start=$SECONDS
          status=0
          # shellcheck disable=SC2016 # the VM's shell expands it
          scripts/ci/fedora-vm.sh -- sh -c \
            'mode=$(getenforce) && echo "SELinux: $mode" && test "$mode" = Enforcing && podman info' ||
            status=$?
          echo "The VM part took $((SECONDS - start)) s and exited $status."
          exit "$status"
