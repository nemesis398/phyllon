# Checks every night for advisories that arrive without a code change. The
# advisories job checks the dependency tree against the RustSec database. The
# scan-image job scans the published image, whose binary carries its crate list
# (cargo auditable), with Grype. A failed run notifies the maintainer by mail.
#
# Changing this file needs the maintainer's explicit approval (AGENTS.md).

name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo deny reads the dependency tree through cargo metadata.
      - run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny check advisories

  # Grype reads the crate list that cargo auditable embeds in the binary, so a
  # crate advisory shows up here even when the lockfile has moved on. The tag
  # is the minor line (0.1) and moves with the release line, in this file.
  # Results go to code scanning; a high or critical finding fails the run. The
  # log shows the cargo-auditable cataloger and its package count (159 for
  # 0.1.0), not the names; a local CycloneDX scan of the same image listed 153
  # of them as pkg:cargo components and 6 as Debian packages.
  scan-image:
    name: scan-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # uploads the SARIF report to code scanning
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          # github.com and raw.githubusercontent.com serve scan-action's Grype
          # download, and github.com redirects its release file to
          # release-assets.githubusercontent.com. ghcr.io and
          # pkg-containers.githubusercontent.com serve the image,
          # grype.anchore.io the vulnerability database, and api.github.com
          # the SARIF upload.
          allowed-endpoints: >
            github.com:443 api.github.com:443 raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443 ghcr.io:443
            pkg-containers.githubusercontent.com:443 grype.anchore.io:443
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          image: ghcr.io/nemesis398/phyllon:0.1
          fail-build: true
          severity-cutoff: high
          output-format: sarif
      # Also when the scan found something, which fails its step.
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-image
