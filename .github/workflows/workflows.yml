# Lints the workflows on every pull request that touches .github/: zizmor for
# security findings and actionlint for mistakes. Both fail the job on any
# finding.
#
# Changing this file needs the maintainer's explicit approval (AGENTS.md).

name: Workflows

on:
  pull_request:
    paths:
      - ".github/**"

permissions: {}

concurrency:
  group: workflows-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Without advanced security the action fails the job on findings instead
      # of uploading them to code scanning.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image bundles shellcheck, which checks the run: scripts.
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
