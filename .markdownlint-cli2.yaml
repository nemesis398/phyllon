config:
  MD013:
    line_length: 80
    tables: false
    code_blocks: false
  MD024:
    siblings_only: true
globs:
  - "**/*.md"
ignores:
  - ".superpowers/**"
  - "node_modules/**"
  - "target/**"
  # Playwright writes error-context.md here when a browser test fails.
  - "test-results/**"
  - "CODE_OF_CONDUCT.md"
  - "CLAUDE.md"
